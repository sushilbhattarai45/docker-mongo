services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/demo
    depends_on:
      - mongo
    networks:
      - demo-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - demo-network

networks:
  demo-network:
    driver: bridge

volumes:
  mongo-data:
